name: Stable integration validation
on:
  push:
    branches: [sync-stable-20260924]
permissions:
  contents: read
jobs:
  focused:
    name: Focused regressions (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: [candidate, stable]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.source == 'stable' && 'f97608f178d1ffeca59860195ab7da295f7c8e5f' || github.sha }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.12.13'
          enable-cache: true
      - name: Install locked test environment
        run: uv sync --locked --python 3.11 --extra dev --extra messaging
      - name: Verify exact revision and lock
        run: |
          git rev-parse HEAD
          uv lock --check
      - name: Focused retained-feature regressions
        env:
          HERMES_TEST_WORKERS: '2'
          HERMES_TEST_FILE_RETRIES: '0'
        run: |
          set -euo pipefail
          source .venv/bin/activate
          mapfile -t files < <(python -c 'import pathlib; patterns=["tests/agent/test_skill_reviewer.py","tests/hermes_cli/test_curator_review.py","tests/agent/test_skill_composition.py","tests/agent/test_skill_topology.py","tests/agent/test_prompt_builder.py","tests/agent/test_proactive_prune_loop_wiring.py","tests/tools/test_skill_view*.py","tests/tools/test_plugin_skills.py","tests/tools/test_skills_tool.py","tests/hermes_cli/test_codex_models.py","tests/hermes_cli/test_gpt6_tiers_registration.py","tests/agent/test_model_metadata*.py","tests/agent/test_reasoning_effort*.py","tests/gateway/test_companion_api.py","tests/test_pairing_invitations.py","tests/hermes_cli/test_web_server_skills_profiles.py"]; print("\n".join(sorted({str(p) for pattern in patterns for p in pathlib.Path().glob(pattern) if p.is_file()})))')
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -gt 0
          scripts/run_tests.sh "${files[@]}" 2>&1 | tee focused-tests.log
